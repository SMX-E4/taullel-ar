<html lang="ca">

<title>Taulell AR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{color-scheme:light dark;--bg:#f5f5f7;--fg:#1d1d1f;--fg2:#6e6e73;--fill:rgba(120,120,128,.12);--blue:#007aff;--red:#ff3b30;--sheet:rgba(250,250,252,.86);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,"Segoe UI",system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#f5f5f7;--fg2:#a1a1a6;--fill:rgba(120,120,128,.24);--blue:#0a84ff;--red:#ff453a;--sheet:rgba(28,28,30,.88)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:var(--font);color:var(--fg);overflow:hidden;background:#000;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.screen{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));overflow-y:auto;background:var(--bg)}
.screen.on{display:flex}
#home{align-items:center;justify-content:center;text-align:center;background:radial-gradient(120% 70% at 50% 0%,rgba(255,204,0,.2),transparent 62%),var(--bg)}
.hero{max-width:400px;width:100%}
.appicon{width:92px;height:92px;margin:0 auto 22px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,#ffd60a,#ff9f0a);box-shadow:0 12px 30px rgba(255,159,10,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.hero h1{margin:0 0 8px;font-size:2.5rem;font-weight:700;letter-spacing:-.03em}
.hero p{margin:0 0 28px;color:var(--fg2);font-size:1.05rem;line-height:1.45}
.btn{display:block;width:100%;border:0;border-radius:14px;min-height:52px;padding:14px 18px;font-weight:600;font-size:1.06rem;cursor:pointer;margin-top:10px;transition:transform .15s var(--ease),opacity .15s}
.btn:active{transform:scale(.97);opacity:.85}
.btn.main,.btn.alt{background:var(--blue);color:#fff}
.btn.tint,.btn.ghost,.btn.light{background:var(--fill);color:var(--blue)}
.btn.danger{background:transparent;color:var(--red)}
.btn:disabled{opacity:.4}
#sync{display:inline-flex;align-items:flex-start;gap:8px;margin-top:22px;color:var(--fg2);font-size:.82rem;line-height:1.35;text-align:left}
#sync::before{content:"";flex:none;margin-top:4px;width:8px;height:8px;border-radius:50%;background:#8e8e93}
#sync[data-s=ok]::before{background:#34c759}#sync[data-s=warn]::before{background:#ff9500}
.glass{background:rgba(28,28,30,.55);color:#fff;border:1px solid rgba(255,255,255,.14);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-radius:20px}
#cork{position:fixed;inset:0;z-index:0;display:none;background:radial-gradient(90% 60% at 50% 0%,#2c2c2e,#000)}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;display:none;background:#000}
#dbg{position:fixed;inset:0;z-index:3;pointer-events:none;display:none}
#hud{position:fixed;z-index:10;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:none;align-items:center;padding:6px 8px 6px 18px;border-radius:22px}
#hud.on{display:flex}#hud b{flex:1;font-weight:600;font-size:1.02rem;letter-spacing:-.01em}
#hud button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:16px;padding:0 16px;min-height:38px;font-weight:600}
#hint{position:fixed;z-index:10;left:24px;right:24px;bottom:104px;padding:12px 16px;text-align:center;display:none;font-size:.92rem;line-height:1.35;border-radius:18px}
#fab{position:fixed;z-index:15;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);display:none;border:0;border-radius:999px;padding:16px 28px;font-weight:600;font-size:1.05rem;background:var(--blue);color:#fff;box-shadow:0 10px 30px rgba(0,122,255,.45);white-space:nowrap;transition:transform .15s var(--ease)}
#fab.on{display:block}#fab:active{transform:translateX(-50%) scale(.96)}
#board{position:fixed;left:0;top:0;transform-origin:0 0;z-index:5;display:none;border-radius:18px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 4px rgba(255,255,255,.28)}
#board.on{display:block}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:38px;font-weight:600;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.5);pointer-events:none}
.pi{position:absolute;width:88px;height:88px;border-radius:10px;background:#ffd60a;box-shadow:0 8px 18px rgba(0,0,0,.35);display:none;pointer-events:none;z-index:0}
#board.pv .pi{display:block}
.pi:nth-child(1){left:-14px;top:-14px;transform:rotate(-4deg)}.pi:nth-child(2){right:-14px;top:-14px;transform:rotate(3deg)}
.pi:nth-child(3){right:-14px;bottom:-14px;transform:rotate(-3deg)}.pi:nth-child(4){left:-14px;bottom:-14px;transform:rotate(4deg)}
#qr{align-items:center;text-align:center}
#qr header{display:flex;align-items:center;width:100%;margin-bottom:18px}#qr header b{flex:1;font-size:1.05rem;font-weight:600;margin-right:56px}
.back{border:0;background:none;color:var(--blue);font-size:1.05rem;font-weight:500;padding:8px 4px;min-height:44px;cursor:pointer}
#qr p{color:var(--fg2);line-height:1.45;max-width:380px}
#qrbox{background:#fff;padding:18px;border-radius:24px;margin:14px 0;box-shadow:0 8px 28px rgba(0,0,0,.12)}
#qr input{width:100%;max-width:420px;padding:14px 16px;border-radius:12px;border:0;margin:8px 0;background:var(--fill);font-size:1rem;outline:none}
#qrFinal{word-break:break-all;color:var(--fg2);font-size:.82rem;max-width:420px}
.sheet{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.4)}
.sheet.on{display:flex}
.panel{background:var(--sheet);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);border-radius:28px 28px 0 0;padding:10px 24px max(26px,env(safe-area-inset-bottom));max-height:92%;overflow-y:auto;box-shadow:0 -10px 40px rgba(0,0,0,.25);max-width:560px;width:100%;margin:0 auto}
.grab{width:38px;height:5px;border-radius:3px;background:var(--fg2);opacity:.45;margin:4px auto 16px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--fill);border-radius:999px;padding:6px 12px;font-size:.78rem;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em}
.chip i{width:9px;height:9px;border-radius:50%}
.panel h2{margin:12px 0 4px;font-size:1.85rem;line-height:1.12;font-weight:700;letter-spacing:-.025em}
.panel .meta{color:var(--fg2);font-size:.92rem;margin-bottom:14px}
.panel p{line-height:1.5;font-size:1.06rem;white-space:pre-wrap;margin:10px 0 16px}
.panel .poster{width:100%;border-radius:16px;margin:6px 0 10px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.panel label.l{display:block;margin:18px 4px 7px;font-size:.78rem;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em}
.panel input[type=text],.panel select,.panel textarea{width:100%;padding:14px 16px;border-radius:12px;border:0;font-size:1.05rem;background:var(--fill);color:var(--fg);outline:none}
.panel input[type=text],.panel textarea{-webkit-appearance:none;appearance:none}
.panel input:focus,.panel select:focus,.panel textarea:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 40%,transparent)}
.sw{display:flex;gap:14px;flex-wrap:wrap;padding:2px 4px}
.sw label{width:38px;height:38px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .15s var(--ease)}
.sw input{display:none}
.sw label:has(input:checked){transform:scale(1.08);box-shadow:0 0 0 3px var(--bg),0 0 0 5.5px var(--fg)}
.row{display:flex;gap:10px}.row .btn{flex:1}
#fFile{display:none}#fFileSt{color:var(--fg2);font-size:.88rem;margin:8px 4px 0}
#toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top)) + 66px);max-width:calc(100% - 32px);padding:12px 20px;text-align:center;display:none;font-size:.95rem;border-radius:999px}
@media (prefers-reduced-motion:no-preference){.sheet.on .panel{animation:up .38s var(--ease)}@keyframes up{from{transform:translateY(60px);opacity:0}}}

/* ===== Inici: fosc, menú a l'esquerra sense requadres, títol gran a la dreta ===== */
#home{flex-direction:row;align-items:center;justify-content:space-between;gap:48px;padding:max(32px,env(safe-area-inset-top)) clamp(24px,6vw,96px) max(32px,env(safe-area-inset-bottom));text-align:left;color:#fff;
  background:radial-gradient(70% 90% at 82% 50%,rgba(255,200,40,.14),transparent 62%),radial-gradient(50% 60% at 0% 100%,rgba(10,132,255,.12),transparent 60%),#000}
.menu{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(14px,3vh,28px)}
.opt{all:unset;box-sizing:border-box;cursor:pointer;padding:4px 0;font-family:var(--font);font-size:clamp(1.35rem,2.7vw,2.1rem);font-weight:500;letter-spacing:-.01em;color:rgba(255,255,255,.55);
  transform-origin:left center;transition:transform .35s var(--ease),color .35s,text-shadow .35s}
.opt:hover,.opt:focus-visible,.opt:active{color:#fff;transform:scale(1.18);text-shadow:0 0 12px rgba(255,255,255,.75),0 0 34px rgba(120,175,255,.65)}
.opt:disabled{opacity:.3;pointer-events:none}
.brand{text-align:right}
.brand h1{margin:0;font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Arial Rounded MT Bold",system-ui,sans-serif;font-size:clamp(3.4rem,10vw,9rem);line-height:.95;font-weight:800;letter-spacing:-.03em;color:#fff}
.brand p{margin:18px 0 0;color:rgba(255,255,255,.5);font-size:clamp(.95rem,1.4vw,1.2rem)}
#home #sync{position:absolute;left:clamp(24px,6vw,96px);bottom:max(22px,env(safe-area-inset-bottom));margin:0;color:rgba(255,255,255,.45);max-width:70%}
@media (max-width:700px){#home{flex-direction:column-reverse;align-items:stretch;justify-content:center;gap:56px}}
@media (prefers-reduced-motion:no-preference){
  .opt{animation:rise .7s var(--ease) both}.opt:nth-child(2){animation-delay:.08s}.opt:nth-child(3){animation-delay:.16s}
  .brand{animation:rise .9s var(--ease) both}@keyframes rise{from{opacity:0;transform:translateY(14px)}}}
#qr{--bg:#000;--fg:#f5f5f7;--fg2:#a1a1a6;--fill:rgba(120,120,128,.24);--blue:#0a84ff;background:#000;color:var(--fg)}

/* ===== Cartells penjats amb xinxeta ===== */
/* ===== Perspectiva: el tauler és un trapezi, els cartells es queden drets ===== */
#board{inset:0;width:auto;height:auto;border-radius:0;background:none;box-shadow:none;pointer-events:none}
#qd{position:absolute;inset:0;background:rgba(255,255,255,.10);pointer-events:none}
/* ===== v3: paper, ombres dinàmiques, vinyeta, cinta, formats, filtres, idiomes ===== */
:root{--grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .3 0 0 0 0 .25 0 0 0 .28 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#qd{background:radial-gradient(circle at var(--cx,50%) var(--cy,50%),rgba(255,255,255,.04) 0,rgba(255,255,255,.1) calc(var(--r,400px)*.55),rgba(0,0,0,.45) calc(var(--r,400px)*1.05))}
#filters{position:fixed;z-index:10;top:calc(max(10px,env(safe-area-inset-top)) + 64px);left:12px;right:12px;display:none;gap:6px;padding:6px;overflow-x:auto;border-radius:18px;scrollbar-width:none}
#filters.on{display:flex}#filters button{flex:none;border:0;background:transparent;color:rgba(255,255,255,.7);padding:8px 14px;border-radius:14px;font-weight:600;font-size:.9rem;cursor:pointer}
#filters button.on{background:rgba(255,255,255,.22);color:#fff}
#toast{top:calc(max(10px,env(safe-area-inset-top)) + 128px)}
.lang{position:absolute;right:clamp(24px,6vw,96px);bottom:max(22px,env(safe-area-inset-bottom));display:flex;gap:16px}
.lang button{all:unset;cursor:pointer;color:rgba(255,255,255,.4);font-weight:600;font-size:.9rem;letter-spacing:.08em;transition:color .25s}
.lang button.on,.lang button:hover{color:#fff}
#pv{display:flex;justify-content:center;padding:26px 0 6px;zoom:.78}
#pv .note{position:relative;left:auto;top:auto;transform:rotate(-2deg);pointer-events:none}
#adminBar{position:fixed;z-index:16;top:calc(max(10px,env(safe-area-inset-top)) + 120px);right:12px;display:none;align-items:center;gap:10px;padding:5px 5px 5px 16px;border-radius:999px;font-size:.82rem;font-weight:600}
#adminBar.on{display:flex}#adminBar button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer}

/* ===== v4: vidre translúcid (Apple), relleu 3D i animacions ===== */
:root{--spec:inset 0 1.5px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(255,255,255,.08)}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.24);box-shadow:var(--spec),0 12px 36px rgba(0,0,0,.3);backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%)}
.btn.main,.btn.alt{background:linear-gradient(180deg,#4aa3ff,#0a6cff);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 22px rgba(10,108,255,.4)}
.btn.tint,.btn.ghost,.btn.light{background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.btn.danger{background:none;box-shadow:none}
#fab{background:linear-gradient(180deg,rgba(74,163,255,.92),rgba(10,108,255,.88));border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 14px 38px rgba(10,108,255,.5)}
#fab:hover{transform:translateX(-50%) scale(1.05)}
#home .orbs{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.orbs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
.orbs i:nth-child(1){width:46vmax;height:46vmax;left:58%;top:-12%;background:#ffb400}
.orbs i:nth-child(2){width:40vmax;height:40vmax;left:-12%;top:52%;background:#0a84ff}
.orbs i:nth-child(3){width:30vmax;height:30vmax;left:34%;top:30%;background:#bf5af2;opacity:.32}
.menu,.brand{position:relative;z-index:1}
#home #sync{z-index:1;padding:8px 14px;border-radius:999px;background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.lang{z-index:1;gap:2px;padding:4px;border-radius:999px;background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:var(--spec),0 8px 24px rgba(0,0,0,.3)}
.lang button{padding:7px 14px;border-radius:999px;transition:background .3s,color .3s}
.lang button.on{background:rgba(255,255,255,.22);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
#qr{background:radial-gradient(90% 60% at 80% 0%,rgba(10,132,255,.25),transparent 60%),radial-gradient(70% 60% at 0% 100%,rgba(255,180,0,.18),transparent 60%),#000}
#qrbox{border-radius:26px;box-shadow:0 18px 50px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.4)}
#qr input{background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.sheet{background:rgba(0,0,0,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.panel{border:1px solid rgba(255,255,255,.26);border-bottom:0;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.04)),var(--sheet);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 -16px 50px rgba(0,0,0,.35)}
.chip{background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.2)}
#filters button{transition:background .3s,color .3s,transform .2s}#filters button:active{transform:scale(.94)}
#board{inset:auto;left:0;top:0;transform-style:preserve-3d;border-radius:20px;background:none;box-shadow:none;pointer-events:none}
#qd{border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04)),radial-gradient(ellipse at center,rgba(255,255,255,0) 0,rgba(255,255,255,.04) 55%,rgba(0,0,0,.42) 112%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.34),inset 0 2px 0 rgba(255,255,255,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.note{position:absolute;width:var(--w,250px);--lift:46px;transform-style:preserve-3d;transform:translate(-50%,-50%) rotate(var(--rz,0deg)) scale(var(--sc,1));cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;pointer-events:auto}
.note.drag{--lift:120px;cursor:grabbing}
@media (hover:hover){.note:not(.drag):hover{--lift:72px}}
.cast{position:absolute;inset:8px;border-radius:24px;background:rgba(0,0,0,.6);filter:blur(16px);opacity:calc(var(--sa,.5)*1.25);transform:translate(calc(var(--lift)*.55),calc(var(--lift)*.9)) translateZ(1px);transition:transform .45s var(--ease);pointer-events:none}
.card{position:relative;border-radius:26px;overflow:hidden;color:#fff;transform:translateZ(var(--lift,46px)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .45s var(--ease);
  background-color:rgba(24,24,28,.6);
  background-image:linear-gradient(150deg,rgba(255,255,255,.32),rgba(255,255,255,.08) 46%,rgba(0,0,0,.18) 100%),linear-gradient(0deg,color-mix(in srgb,var(--c) 26%,transparent),color-mix(in srgb,var(--c) 26%,transparent));
  backdrop-filter:blur(22px) saturate(190%);-webkit-backdrop-filter:blur(22px) saturate(190%);border:1px solid rgba(255,255,255,.36);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.65),inset 0 -2px 6px rgba(0,0,0,.25),1px 1px 0 rgba(255,255,255,.2),2px 2px 0 rgba(255,255,255,.12),3px 4px 0 rgba(0,0,0,.3),4px 6px 0 rgba(0,0,0,.2),5px 8px 0 rgba(0,0,0,.12)}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.26) 42%,transparent 54%);transform:translateX(-70%);pointer-events:none}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 70%,transparent),inset 0 0 30px color-mix(in srgb,var(--c) 30%,transparent)}
.card .hd{display:inline-flex;margin:18px 18px 0;padding:6px 14px;border-radius:999px;background:var(--c);font-size:16px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;box-shadow:0 4px 12px color-mix(in srgb,var(--c) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
.card h3{margin:14px 20px 8px;font-size:29px;line-height:1.1;font-weight:800;letter-spacing:-.02em;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.35);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card p{margin:0 20px;font-size:17px;line-height:1.38;color:rgba(255,255,255,.84);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card span{display:inline-flex;margin:14px 20px 18px;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);font-size:17px;font-weight:600}
.note:not(.p):not(.s) .card{min-height:250px}
.note.s h3{font-size:24px;margin:10px 16px 6px}.note.s .hd{font-size:14px;margin:14px 14px 0}.note.s span{margin:10px 14px 14px;font-size:15px}

  if(!o&&bl.length>=3&&det.nq&&now-det.seen<HOLD_MS)o=guess3(bl.slice(0,3),det.nq);
  if(o){det.fail=0;if(++det.ok>25&&det.W>480){det.W=Math.max(480,det.W-240);det.ok=0;}}
  else{det.ok=0;if(++det.fail>=2&&det.W<960){det.W=Math.min(960,det.W+240);det.fail=0;}}   // resolució adaptable
  b.style.setProperty("--sa",clamp(.22+det.lum/255*.5,.22,.7).toFixed(2));                 // ombra segons la llum
  drawDbg(bl,o,v);
  if(o){
    det.nq=o;const pts=o.map(p=>toScreen(p,v));
    det.tgt=det.tgt&&now-det.seen<HOLD_MS?det.tgt.map((q,i)=>{const dx=pts[i][0]-q[0],dy=pts[i][1]-q[1],dd=Math.hypot(dx,dy);
      if(dd<1.5)return q;const a=clamp(dd/60,.12,.7);return[q[0]+dx*a,q[1]+dy*a];}):pts;      // filtre EMA adaptatiu
    det.seen=now;b.classList.add("on");hint.style.display="none";
    if(!det.told){det.told=true;toast(t("dragTip"));}
  }else if(now-det.seen>HOLD_MS){
    b.classList.remove("on");det.tgt=det.cur=null;quad=null;det.nq=null;hint.style.display="block";hint.textContent=t("hintN",{n:Math.min(bl.length,3)});
  }else if(now-det.seen>600){hint.style.display="block";hint.textContent=t("hintHold");}      // manté l'últim tauler vàlid
}
/* Interpolació a 60 fps cap a la posició detectada: el tauler no tremola */
function tick(){
  det.raf=requestAnimationFrame(tick);
  if(mode!=="ar"||!det.tgt)return;
  det.cur=det.cur?det.cur.map((q,i)=>[q[0]+(det.tgt[i][0]-q[0])*.3,q[1]+(det.tgt[i][1]-q[1])*.3]):det.tgt.map(q=>q.slice());
  const h=hCoef([[0,0],[BW,0],[BW,BH],[0,BH]],det.cur);if(!h)return;
  const keep=H;H=h;
  const sc=[[0,0],[BW,0],[BW,BH],[0,BH]].map(p=>lscale(p[0],p[1])),r=Math.max(...sc)/Math.min(...sc);
  if(!isFinite(r)||r>3.5){H=keep;return;}          // perspectiva extrema: es manté l'últim tauler vàlid
  quad=det.cur;applyBoard();
}
function hCoef(src,dst){
  const A=[],y=[];
  for(let i=0;i<4;i++){const[x,yy]=src[i],[u,v]=dst[i];
    A.push([x,yy,1,0,0,0,-u*x,-u*yy]);y.push(u);A.push([0,0,0,x,yy,1,-v*x,-v*yy]);y.push(v);}
  const n=8;
  for(let i=0;i<n;i++){let m=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;
    [A[i],A[m]]=[A[m],A[i]];[y[i],y[m]]=[y[m],y[i]];
    for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i];for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];y[r]-=f*y[i];}}
  const x=Array(n).fill(0);
  for(let i=n-1;i>=0;i--){let s=y[i];for(let c=i+1;c<n;c++)s-=A[i][c]*x[c];x[i]=s/A[i][i];}
  return x.some(q=>!isFinite(q))?null:x;
}

function openRead(id){
  const n=notes.find(x=>x.id===id);if(!n)return;
  const cat=CATS[n.cat]?n.cat:"avisos",col=/^#[0-9a-f]{6}$/i.test(n.color)?n.color:"#007AFF",p=$("#readPanel");
  p.innerHTML=`<div class="grab"></div><div class="chip"><i style="background:${col}"></i>${cl(cat)}</div>
    <h2>${esc(n.title)}</h2><div class="meta">${fmtDate(n.date)} · ${esc(n.author||t("anon"))}</div>
    ${okImg(n.img)?`<img class="poster" src="${n.img}" alt="">`:""}
    ${n.desc?`<p>${esc(n.desc)}</p>`:""}
    <button class="btn main" id="rClose">${t("close")}</button>
    <button class="btn danger" id="rReport">${t("report")}</button>${adminMode?`<button class="btn danger" id="rDel">${t("delAll")}</button>`:""}`;
  $("#read").classList.add("on");
  $("#rClose").onclick=()=>$("#read").classList.remove("on");
  if(adminMode)$("#rDel").onclick=async()=>{if(!confirm(t("delAsk")))return;try{await Store.remove(id);$("#read").classList.remove("on");toast(t("delDone"));}catch(e){toast(t("delFail"));}};
  $("#rReport").onclick=async()=>{
    if(!confirm(t("repAsk")))return;
    hidden.add(id);try{localStorage.setItem(LSR,JSON.stringify([...hidden]));}catch(e){}
    try{await Store.report(id);}catch(e){}
    notes=notes.filter(x=>x.id!==id);renderBoard();
    $("#read").classList.remove("on");toast(t("repDone"));
  };
}
$("#read").onclick=e=>{if(e.target.id==="read")e.target.classList.remove("on");};

$("#sw").innerHTML=COLORS.map((c,i)=>`<label style="background:${c}"><input type="radio" name="col" value="${c}" ${i?"":"checked"}></label>`).join("");
let pendingImg=null,pendingPdf=false;
const stat=m=>$("#fFileSt").textContent=m;
function formNote(){
  return{id:"pv",cat:$("#fC").value,title:$("#fT").value.trim()||t("lTitle"),desc:$("#fD").value.trim(),
    color:(document.querySelector("input[name=col]:checked")||{}).value||COLORS[1],x:.5,y:.5,z:1,fmt:$("#fF").value||undefined,img:pendingImg||undefined,pdf:pendingPdf};
}
function updPv(){$("#pv").innerHTML=noteHTML(formNote());}
$("#form").addEventListener("input",updPv);$("#form").addEventListener("change",updPv);
$("#fab").onclick=()=>{$("#add").classList.add("on");updPv();};
$("#fCancel").onclick=()=>$("#add").classList.remove("on");
$("#fFileBtn").onclick=()=>$("#fFile").click();
$("#fCamBtn").onclick=()=>$("#fCam").click();
function toJpeg(src,w,h){
  for(const M of[900,700,520]){
    const k=Math.min(1,M/w),cw=Math.round(w*k),ch=Math.round(h*k),c=document.createElement("canvas");
    c.width=cw;c.height=ch;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cw,ch);x.drawImage(src,0,0,cw,ch);
    for(let q=.8;q>=.3;q-=.1){const u=c.toDataURL("image/jpeg",q);if(u.length<700000)return u;}
  }
  return null;
}
const loadScript=u=>new Promise((ok,ko)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=ko;document.head.appendChild(s);});
async function fileToImg(f){
  if(f.type==="application/pdf"){
    if(!window.pdfjsLib){await loadScript(PDFJS+"pdf.min.js");pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js";}
    const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
    const pg=await pdf.getPage(1),v0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:900/v0.width});
    const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
    await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    return toJpeg(c,c.width,c.height);
  }
  const bm=await createImageBitmap(f);return toJpeg(bm,bm.width,bm.height);
}
async function onFile(e){
  const f=e.target.files[0];pendingImg=null;pendingPdf=false;
  if(!f){stat("");updPv();return;}
  if(f.size>MAX_FILE_MB*1048576){stat(t("fileBig",{mb:MAX_FILE_MB}));e.target.value="";updPv();return;}
  stat(t("procIng"));$("#fOk").disabled=true;
  try{
    pendingImg=await fileToImg(f);pendingPdf=f.type==="application/pdf";
    stat(pendingImg?t(pendingPdf?"imgPdf":"imgAdded",{name:f.name,kb:Math.round(pendingImg.length*.75/1024)}):t("imgBig"));
  }catch(err){stat(t("imgFail"));}
  e.target.value="";$("#fOk").disabled=false;updPv();
}
$("#fFile").onchange=onFile;$("#fCam").onchange=onFile;
$("#form").onsubmit=async e=>{
  e.preventDefault();
  const d=$("#fD").value.trim();
  if(!d&&!pendingImg){toast(t("needDesc"));return;}
  const n={cat:$("#fC").value,title:$("#fT").value.trim(),desc:d,author:$("#fA").value.trim()||t("anon"),
    color:document.querySelector("input[name=col]:checked").value,date:new Date().toISOString().slice(0,10),
    x:.5+(Math.random()-.5)*.2,y:.5+(Math.random()-.5)*.2,z:maxZ()+1,reports:0,sc:1};
  if($("#fF").value)n.fmt=$("#fF").value;
  if(pendingImg){n.img=pendingImg;if(pendingPdf)n.pdf=true;}
  $("#fOk").disabled=true;
  try{await Store.add(n);$("#form").reset();pendingImg=null;pendingPdf=false;stat("");$("#add").classList.remove("on");toast(t("published"));}
  catch(err){toast(t("pubFail"));}
  $("#fOk").disabled=false;updPv();
};

/* PWA opcional: si has pujat manifest.json i sw.js s'activa; si no, es neteja qualsevol service worker antic */
(async()=>{
  const has=async u=>{try{return(await fetch(u,{method:"HEAD",cache:"no-store"})).ok;}catch(e){return false;}};
  if(await has("manifest.json")){const l=document.createElement("link");l.rel="manifest";l.href="manifest.json";document.head.appendChild(l);}
  if(!("serviceWorker" in navigator)||!location.protocol.startsWith("http"))return;
  if(await has("sw.js"))navigator.serviceWorker.register("sw.js").catch(()=>{});
  else{(await navigator.serviceWorker.getRegistrations()).forEach(r=>r.unregister());if(window.caches)(await caches.keys()).forEach(k=>caches.delete(k));}
})();
