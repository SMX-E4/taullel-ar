<!DOCTYPE html>
<html lang="ca" data-lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <title>Taulell AR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root{--bg:#f5f5f7;--fg:#1d1d1f;--fg2:#6e6e73;--fill:rgba(120,120,128,.12);--blue:#007aff;--red:#ff3b30;--sheet:rgba(250,250,252,.86);--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,"Segoe UI",system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1);--paper:#fdf6e3;--shadow:rgba(0,0,0,.35);--pin:#e63946}
    @media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#f5f5f7;--fg2:#a1a1a6;--fill:rgba(120,120,128,.24);--blue:#0a84ff;--red:#ff453a;--sheet:rgba(28,28,30,.88)}}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;height:100%;font-family:var(--font);color:var(--fg);overflow:hidden;background:#000;-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit;color:inherit}
    .screen{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));overflow-y:auto;background:var(--bg)}
    .screen.on{display:flex}
    #home{align-items:center;justify-content:center;text-align:center;background:radial-gradient(120% 70% at 50% 0%,rgba(255,204,0,.2),transparent 62%),var(--bg)}
    .hero{max-width:400px;width:100%}
    .appicon{width:92px;height:92px;margin:0 auto 22px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,#ffd60a,#ff9f0a);box-shadow:0 12px 30px rgba(255,159,10,.35),inset 0 1px 0 rgba(255,255,255,.5)}
    .hero h1{margin:0 0 8px;font-size:2.5rem;font-weight:700;letter-spacing:-.03em}
    .hero p{margin:0 0 28px;color:var(--fg2);font-size:1.05rem;line-height:1.45}
    .btn{display:block;width:100%;border:0;border-radius:14px;min-height:52px;padding:14px 18px;font-weight:600;font-size:1.06rem;cursor:pointer;margin-top:10px;transition:transform .15s var(--ease),opacity .15s}
    .btn:active{transform:scale(.97);opacity:.85}
    .btn.main,.btn.alt{background:var(--blue);color:#fff}
    .btn.tint,.btn.ghost,.btn.light{background:var(--fill);color:var(--blue)}
    .btn.danger{background:transparent;color:var(--red)}
    .btn:disabled{opacity:.4}
    #sync{display:inline-flex;align-items:flex-start;gap:8px;margin-top:22px;color:var(--fg2);font-size:.82rem;line-height:1.35;text-align:left}
    #sync::before{content:"";flex:none;margin-top:4px;width:8px;height:8px;border-radius:50%;background:#8e8e93}
    #sync[data-s="ok"]::before{background:#34c759}#sync[data-s="warn"]::before{background:#ff9500}
    .glass{background:rgba(28,28,30,.55);color:#fff;border:1px solid rgba(255,255,255,.14);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-radius:20px}
    #cork{position:fixed;inset:0;z-index:0;display:none;background:radial-gradient(90% 60% at 50% 0%,#2c2c2e,#000)}
    #cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;display:none;background:#000}
    #dbg{position:fixed;inset:0;z-index:3;pointer-events:none;display:none}
    #hud{position:fixed;z-index:10;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:none;align-items:center;padding:6px 8px 6px 18px;border-radius:22px}
    #hud.on{display:flex}#hud b{flex:1;font-weight:600;font-size:1.02rem;letter-spacing:-.01em}
    #hud button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:16px;padding:0 16px;min-height:38px;font-weight:600}
    #hint{position:fixed;z-index:10;left:24px;right:24px;bottom:104px;padding:12px 16px;text-align:center;display:none;font-size:.92rem;line-height:1.35;border-radius:18px}
    #fab{position:fixed;z-index:15;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);display:none;border:0;border-radius:999px;padding:16px 28px;font-weight:600;font-size:1.05rem;background:var(--blue);color:#fff;box-shadow:0 10px 30px rgba(0,122,255,.45);white-space:nowrap;transition:transform .15s var(--ease)}
    #fab.on{display:block}#fab:active{transform:translateX(-50%) scale(.96)}
    #board{position:fixed;left:0;top:0;transform-origin:0 0;z-index:5;display:none;border-radius:18px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 4px rgba(255,255,255,.28)}
    #board.on{display:block}
    #board::before{content:"";position:absolute;inset:0;border-radius:18px;opacity:.35;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.12'/%3E%3C/svg%3E")}
    #board::after{content:"";position:absolute;inset:-40px;border-radius:60px;pointer-events:none;opacity:0;transition:opacity .6s ease;background:radial-gradient(circle at center,transparent 0%,rgba(0,0,0,.55) 100%)}
    #board.ar-active::after{opacity:1}
    .note{position:absolute;width:var(--note-w,250px);height:var(--note-h,330px);padding:0;gap:0;border-radius:4px;overflow:visible;background:var(--paper);background-image:linear-gradient(135deg,rgba(255,255,255,.7),rgba(0,0,0,.05));color:#1d1d1f;box-shadow:0 1px 2px rgba(0,0,0,.2),0 18px 26px -6px var(--shadow);transform:translate(-50%,-50%) rotate(var(--note-rot,0deg)) scale(var(--note-scale,1));cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform}
    .note::before{content:"";position:absolute;top:-14px;left:50%;width:34px;height:34px;margin-left:-17px;border-radius:50%;z-index:2;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9) 0,rgba(255,255,255,0) 25%),radial-gradient(circle at 42% 40%,var(--pin,#e63946) 0,var(--pin,#e63946) 50%,rgba(0,0,0,.45) 100%);box-shadow:0 8px 10px -2px rgba(0,0,0,.5),inset -2px -3px 6px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.5)}
    .note::after{content:"";position:absolute;top:9px;left:50%;width:38px;height:14px;margin-left:-4px;border-radius:50%;background:rgba(0,0,0,.22);filter:blur(4px);z-index:1}
    .note .hd{padding:32px 18px 10px;background:var(--c);font-size:17px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-align:center;color:#fff;border-radius:3px 3px 0 0}
    .note h3{margin:14px 18px 6px;font-size:28px;line-height:1.12;font-weight:800;letter-spacing:-.02em;color:#1d1d1f;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
    .note p{margin:0 18px;font-size:16px;line-height:1.38;color:#5a5a5f;display:-webkit-box;-webkit-line-clamp:var(--note-lines,5);-webkit-box-orient:vertical;overflow:hidden}
    .note span{margin:auto 18px 14px;padding:10px 0 0;align-self:stretch;display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;color:#1d1d1f;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:0}
    .note span::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
    .note.drag{cursor:grabbing;box-shadow:0 24px 44px rgba(0,0,0,.5);z-index:50}
    .note.p{width:var(--note-w,240px);height:auto;min-height:0;padding:22px 12px 0;overflow:visible;background:#fff}
    .note.p img{display:block;width:100%;height:auto;box-shadow:0 0 0 1px rgba(0,0,0,.1);pointer-events:none;-webkit-user-drag:none}
    .note.p b{padding:10px 4px 12px;font-size:19px;line-height:1.2;font-weight:700;color:#1d1d1f}
    .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:36px;font-weight:600;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.5);pointer-events:none}
    .pi{position:absolute;width:92px;height:92px;border-radius:10px;background:#ffd60a;box-shadow:0 8px 18px rgba(0,0,0,.35);display:none;pointer-events:none;z-index:0}
    #board.pv .pi{display:block}
    .pi:nth-child(1){left:-14px;top:-14px;transform:rotate(-4deg)}.pi:nth-child(2){right:-14px;top:-14px;transform:rotate(3deg)}
    .pi:nth-child(3){right:-14px;bottom:-14px;transform:rotate(-3deg)}.pi:nth-child(4){left:-14px;bottom:-14px;transform:rotate(4deg)}
    .admin-bar{position:fixed;top:10px;left:10px;right:10px;z-index:100;display:flex;gap:8px;padding:6px;background:rgba(0,0,0,.75);border-radius:10px;backdrop-filter:blur(8px);display:none}
    .admin-bar .btn{width:auto;min-height:auto;padding:6px 12px;font-size:.85rem;margin:0;white-space:nowrap}
    .filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
    .filtro{padding:6px 12px;border-radius:20px;border:1px solid var(--fill);background:var(--fill);color:var(--fg2);font-size:.85rem;cursor:pointer}
    .filtro.actiu{background:var(--blue);color:#fff;border-color:var(--blue)}
    #toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top)) + 66px);max-width:calc(100% - 32px);padding:12px 20px;text-align:center;display:none;font-size:.95rem;border-radius:999px}
    .sheet{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.4)}
    .sheet.on{display:flex}
    .panel{background:var(--sheet);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);border-radius:28px 28px 0 0;padding:10px 24px max(26px,env(safe-area-inset-bottom));max-height:92%;overflow-y:auto;box-shadow:0 -10px 40px rgba(0,0,0,.25);max-width:560px;width:100%;margin:0 auto}
    .grab{width:38px;height:5px;border-radius:3px;background:var(--fg2);opacity:.45;margin:4px auto 16px}
    .chip{display:inline-flex;align-items:center;gap:8px;background:var(--fill);border-radius:999px;padding:6px 12px;font-size:.78rem;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em}
    .chip i{width:9px;height:9px;border-radius:50%}
    .panel h2{margin:12px 0 4px;font-size:1.85rem;line-height:1.12;font-weight:700;letter-spacing:-.025em}
    .panel .meta{color:var(--fg2);font-size:.92rem;margin-bottom:14px}
    .panel p{line-height:1.5;font-size:1.06rem;white-space:pre-wrap;margin:10px 0 16px}
    .panel .poster{width:100%;border-radius:16px;margin:6px 0 10px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.18)}
    .panel label.l{display:block;margin:18px 4px 7px;font-size:.78rem;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em}
    .panel input[type=text],.panel select,.panel textarea{width:100%;padding:14px 16px;border-radius:12px;border:0;font-size:1.05rem;background:var(--fill);color:var(--fg);outline:none}
    .panel input[type=text],.panel textarea{-webkit-appearance:none;appearance:none}
    .panel input:focus,.panel select:focus,.panel textarea:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 40%,transparent)}
    .sw{display:flex;gap:14px;flex-wrap:wrap;padding:2px 4px}
    .sw label{width:38px;height:38px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .15s var(--ease)}
    .sw input{display:none}
    .sw label:has(input:checked){transform:scale(1.08);box-shadow:0 0 0 3px var(--bg),0 0 0 5.5px var(--fg)}
    .row{display:flex;gap:10px}.row .btn{flex:1}
    #fFile{display:none}#fFileSt{color:var(--fg2);font-size:.88rem;margin:8px 4px 0}
    #preview{margin:14px 0;border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--fill);display:none;animation:up .3s var(--ease)}
    #preview img{width:100%;height:auto;display:block}#preview p{padding:12px 16px;margin:0;font-size:1rem;color:#333}
    @media (prefers-reduced-motion:no-preference){.sheet.on .panel{animation:up .38s var(--ease)}@keyframes up{from{transform:translateY(60px);opacity:0}}}
    [data-lang]{display:none}[data-lang="ca"],[data-lang="es"],[data-lang="en"]{display:none}html[data-lang="ca"] [data-lang="ca"],html[data-lang="es"] [data-lang="es"],html[data-lang="en"] [data-lang="en"]{display:inline}
    #home{flex-direction:row;align-items:center;justify-content:space-between;gap:48px;padding:max(32px,env(safe-area-inset-top)) clamp(24px,6vw,96px) max(32px,env(safe-area-inset-bottom));text-align:left;color:#fff;background:radial-gradient(70% 90% at 82% 50%,rgba(255,200,40,.14),transparent 62%),radial-gradient(50% 60% at 0% 100%,rgba(10,132,255,.12),transparent 60%),#000}
    .menu{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(14px,3vh,28px)}
    .opt{all:unset;box-sizing:border-box;cursor:pointer;padding:4px 0;font-family:var(--font);font-size:clamp(1.35rem,2.7vw,2.1rem);font-weight:500;letter-spacing:-.01em;color:rgba(255,255,255,.55);transform-origin:left center;transition:transform .35s var(--ease),color .35s,text-shadow .35s}
    .opt:hover,.opt:focus-visible,.opt:active{color:#fff;transform:scale(1.18);text-shadow:0 0 12px rgba(255,255,255,.75),0 0 34px rgba(120,175,255,.65)}.opt:disabled{opacity:.3;pointer-events:none}
    .brand{text-align:right}
    .brand h1{margin:0;font-family:ui-rounded,"SF Pro Rounded",Nunito,"Varela Round","Arial Rounded MT Bold",system-ui,sans-serif;font-size:clamp(3.4rem,10vw,9rem);line-height:.95;font-weight:800;letter-spacing:-.03em;color:#fff}
    .brand p{margin:18px 0 0;color:rgba(255,255,255,.5);font-size:clamp(.95rem,1.4vw,1.2rem)}
    #home #sync{position:absolute;left:clamp(24px,6vw,96px);bottom:max(22px,env(safe-area-inset-bottom));margin:0;color:rgba(255,255,255,.45);max-width:70%}
    @media (max-width:700px){#home{flex-direction:column-reverse;align-items:stretch;justify-content:center;gap:56px}}
    @media (prefers-reduced-motion:no-preference){.opt{animation:rise .7s var(--ease) both}.opt:nth-child(2){animation-delay:.08s}.opt:nth-child(3){animation-delay:.16s}.brand{animation:rise .9s var(--ease) both}@keyframes rise{from{opacity:0;transform:translateY(14px)}}}
    #qr{--bg:#000;--fg:#f5f5f7;--fg2:#a1a1a6;--fill:rgba(120,120,128,.24);--blue:#0a84ff;background:#000;color:var(--fg)}
    #qr header{display:flex;align-items:center;width:100%;margin-bottom:18px}#qr header b{flex:1;font-size:1.05rem;font-weight:600;margin-right:56px}
    .back{border:0;background:none;color:var(--blue);font-size:1.05rem;font-weight:500;padding:8px 4px;min-height:44px;cursor:pointer}
    #qr p{color:var(--fg2);line-height:1.45;max-width:380px}
    #qrbox{background:#fff;padding:18px;border-radius:24px;margin:14px 0;box-shadow:0 8px 28px rgba(0,0,0,.12)}
    #qr input{width:100%;max-width:420px;padding:14px 16px;border-radius:12px;border:0;margin:8px 0;background:var(--fill);font-size:1rem;outline:none}

<body>

  <section id="home" class="screen on">
    <nav class="menu" aria-label="Menú principal">
      <button class="opt" id="bStart" data-i18n="start">Activa la càmera AR</button>
      <button class="opt" id="bQr" data-i18n="qr">Generador de codi QR</button>
      <button class="opt" id="bPrev" data-i18n="prev">Vista prèvia sense càmera</button>
    </nav>
    <div class="brand">
      <h1 data-i18n="appTitle">Taulell<br>AR</h1>
      <p data-i18n="subtitle">Les notícies de l'institut, sobre el tauler.</p>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button class="btn ghost" style="width:auto;min-height:auto;padding:6px 12px;font-size:.85rem" onclick="setLang('ca')" data-i18n="langCa">Català</button>
        <button class="btn ghost" style="width:auto;min-height:auto;padding:6px 12px;font-size:.85rem" onclick="setLang('es')" data-i18n="langEs">Español</button>
        <button class="btn ghost" style="width:auto;min-height:auto;padding:6px 12px;font-size:.85rem" onclick="setLang('en')" data-i18n="langEn">English</button>
      </div>
    </div>
    <small id="sync"></small>
  </section>

  <section id="qr" class="screen">
    <header><button class="back" id="qBack" data-i18n="back">‹ Inici</button><b data-i18n="qrTitle">Codi QR del tauler</b></header>
    <p data-i18n="qrDesc">Escriu l'adreça on has publicat l'app. El QR obrirà la càmera AR directament.</p>
    <input id="qrUrl" type="text" aria-label="Adreça de l'app">
    <div id="qrbox"></div>
    <div id="qrFinal"></div>
    <p data-i18n="qrNote">Enganxa el QR al costat del tauler i un post-it a cada cantonada.</p>
  </section>

  <div id="adminBar" class="admin-bar">
    <span style="color:#fff;font-size:.75rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase" data-i18n="admin">Mode admin</span>
    <button class="btn danger" onclick="disableAdmin()" data-i18n="adminOff">Desactivar admin</button>
  </div>

  <div id="filtros" class="filtros" style="position:fixed;top:10px;left:10px;right:10px;z-index:11;display:none;justify-content:center;gap:8px;padding:6px;background:rgba(0,0,0,.7);border-radius:10px;backdrop-filter:blur(8px)">
    <button class="filtro actiu" data-cat="" data-i18n="catAll">Totes</button>
  </div>

  <div id="cork"></div>
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="dbg"></canvas>
  <div id="board"></div>

  <div id="hud" class="glass"><b id="hudT">Taulell AR</b><button id="bExit" data-i18n="close">Sortir</button></div>
  <div id="hint" class="glass"></div>
  <button id="fab" data-i18n="newPost">＋ Nova notícia</button>
  <div id="toast" class="glass"></div>

  <div id="read" class="sheet"><div class="panel" id="readPanel"></div></div>

  <div id="add" class="sheet">
    <div class="panel">
      <div class="grab"></div>
      <h2 data-i18n="newPost">Nova notícia</h2>
      <form id="form" autocomplete="off">
        <label class="l" for="fT" data-i18n="title">Títol</label>
        <input id="fT" type="text" maxlength="60" required>

        <label class="l" for="fC" data-i18n="category">Categoria</label>
        <select id="fC"></select>

        <label class="l" for="fD" data-i18n="desc">Descripció</label>
        <textarea id="fD" rows="3" maxlength="500"></textarea>

        <label class="l" for="fTpl" data-i18n="poster">Mida / plantilla</label>
        <div class="sw" id="swTpl">
          <label style="background:#fff;border:2px solid #ccc"><input type="radio" name="tpl" value="s" checked> <small style="font-size:.7rem">Petita</small></label>
          <label style="background:#fff;border:2px solid #ccc"><input type="radio" name="tpl" value="m"> <small style="font-size:.7rem">Mitjana</small></label>
          <label style="background:#fff;border:2px solid #ccc"><input type="radio" name="tpl" value="l"> <small style="font-size:.7rem">Gran</small></label>
        </div>

        <label class="l" data-i18n="poster">Cartell (opcional)</label>
        <button type="button" class="btn light" id="fFileBtn" data-i18n="import">Importa un PDF o una imatge</button>
        <button type="button" class="btn light" id="fCapBtn" data-i18n="capture">Fes una foto del cartell</button>
        <input id="fFile" type="file" accept="application/pdf,image/*" capture="environment">
        <div id="fFileSt"></div>

        <div id="preview"></div>

        <label class="l" for="fA" data-i18n="author">Autor/a (opcional)</label>
        <input id="fA" type="text" maxlength="40">

        <label class="l" data-i18n="color">Color de la targeta</label>
        <div class="sw" id="sw"></div>

        <div class="row" style="margin-top:20px">
          <button type="button" class="btn light" id="fCancel" data-i18n="cancel">Cancel·la</button>
          <button type="submit" class="btn alt" id="fOk" data-i18n="publish">Publica</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    /* ============ CONFIGURACIÓ ============ */
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyCJgrdaDPQKYR2V5nbLbyOTu70gHGAGn4Y",
      authDomain: "taulell-ar.firebaseapp.com",
      projectId: "taulell-ar",
      storageBucket: "taulell-ar.firebasestorage.app",
      messagingSenderId: "161850430198",
      appId: "1:161850430198:web:0424d7aab297f043ec52d7"
    };
    const REQUIRE_SHARED = true;

    let LANG = localStorage.getItem("taulellAR.lang") || "ca";

            const B = "https://www.gstatic.com/firebasejs/10.12.2/";
            const [a, f] = await Promise.all([import(B + "firebase-app.js"), import(B + "firebase-firestore.js")]);
            this.fs = f;
            this.db = f.getFirestore(a.initializeApp(FIREBASE_CONFIG));
            this.col = f.collection(this.db, "noticies");
            f.onSnapshot(this.col, (s) => {
              if (s.empty && !s.metadata.fromCache && !this.seeded) {
                this.seeded = true;
                const batch = f.writeBatch(this.db);
                SEED.forEach(({ id, ...d }) => { const docRef = f.doc(this.db, "noticies", id); batch.set(docRef, d); });
                batch.commit().catch(() => {});
                return;
              }
              this.list = s.docs.map(d => ({ id: d.id, ...d.data() }));
              this.emit();
            }, (err) => {
              toast("Error de connexió amb el tauler.");
              const sy = $("#sync");
              if (sy) { sy.dataset.s = "warn"; sy.textContent = "Error de Firebase: " + (err.code || err.message); }
            });
            this.live = true;
            return;
          } catch (e) { toast("Firebase no disponible. S'usa el mode local."); }
        }
        try { this.list = JSON.parse(localStorage.getItem(LS)); } catch (e) { }
        if (!Array.isArray(this.list)) { this.list = SEED.map(n => ({ ...n })); this._save(); }
        this.emit();

      _save() { try { localStorage.setItem(LS, JSON.stringify(this.list)); } catch (e) { toast("No hi ha espai per desar."); } },

        if (this.live) await this.fs.updateDoc(this.fs.doc(this.db, "noticies", id), { reports: this.fs.increment(1) });
        else { const n = this.list.find(n => n.id === id); if (n) { n.reports = (n.reports || 0) + 1; this._save(); this.emit(); } }
      },
      async deleteForAll(id) {
        if (this.live) await this.fs.deleteDoc(this.fs.doc(this.db, "noticies", id));

    /* ============ TAULER / NOTES ============ */
    const PINS = ["#e63946", "#0a84ff", "#2ecc71", "#f5b700"];
    const hsh = id => Math.abs([...String(id)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 0));

    function noteHTML(n) {
      const c = CATS[n.cat] || CATS.avisos;
      const col = /^#[0-9a-f]{6}$/i.test(n.color) ? n.color : "#007AFF";
      const tc = dark(col) ? "#fff" : "#1d1d1f";
      const tpl = TEMPLATES[n.tpl || "m"];
      const st = `left:${clamp(n.x ?? 0.5, 0, 1) * 100}%;top:${clamp(n.y ?? 0.5, 0, 1) * 100}%;z-index:${(n.z || 1) + 1};transform:translate(-50%,-50%) rotate(${rot(n.id)}deg) scale(${n.scale || 1});--c:${col};--pin:${PINS[hsh(n.id) % 4]};--note-w:${tpl.w}px;--note-h:${tpl.h}px;--note-lines:${tpl.lines};`;
      if (okImg(n.img)) return `<div class="note p" data-id="${esc(n.id)}" style="${st}"><img src="${n.img}" alt="${esc(n.title)}"><b>${esc(n.title)}</b></div>`;
      const ex = esc((n.desc || "").replace(/\s+/g, " ").slice(0, 140));
      return `<div class="note" data-id="${esc(n.id)}" style="${st}"><div class="hd" style="color:${tc}">${c.label}</div><h3>${esc(n.title)}</h3>${ex ? `<p>${ex}</p>` : ""}<span>${t("readMore")}</span></div>`;
    }
    function renderBoard() {
      const b = $("#board");
      b.style.width = BW + "px";
      b.style.height = BH + "px";

      b.innerHTML = '<i class="pi"></i><i class="pi"></i><i class="pi"></i><i class="pi"></i>' +
        (list.length ? list.map(noteHTML).join("") : `<div class="empty">${t("empty")}</div>`);
    }

    /* ============ HOMOGRAFIA ============ */
    function toBoard(px, py) {
      if (!quad) return null;
      const h = hCoef(quad, [[0, 0], [BW, 0], [BW, BH], [0, BH]]);
      if (!h) return null;
      const [a, bb, c, d, e, f, g, k] = h, w = g * px + k * py + 1;
      return [(a * px + bb * py + c) / w, (d * px + e * py + f) / w];
    }
    const boardEl = $("#board");
    boardEl.addEventListener("pointerdown", e => {
      const el = e.target.closest(".note");
      if (!el) return;
      drag = { id: el.dataset.id, el, sx: e.clientX, sy: e.clientY, moved: false, pid: e.pointerId, scale: parseFloat(el.style.scale || 1) };
      try { el.setPointerCapture(e.pointerId); } catch (_) { }
    });
    boardEl.addEventListener("pointermove", e => {
      if (!drag) return;
      if (activeTouches.size === 0 || (activeTouches.size === 1 && activeTouches.has(drag.pid))) {
        if (!drag.moved) {
          if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 10) return;
          drag.moved = true;
          drag.el.classList.add("drag");
          drag.el.style.zIndex = maxZ() + 5;
        }
        const p = toBoard(e.clientX, e.clientY);
        if (!p) return;
        drag.x = clamp(p[0] / BW, 0.04, 0.96);
        drag.y = clamp(p[1] / BH, 0.05, 0.95);
        drag.el.style.left = drag.x * 100 + "%";
        drag.el.style.top = drag.y * 100 + "%";
      }
      activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY, noteId: drag.id });
      if (activeTouches.size === 2) pinchZoom();
    });
    function pinchZoom() {
      const [t1, t2] = [...activeTouches.values()];
      const d = Math.hypot(t1.x - t2.x, t1.y - t2.y);
      if (!drag || !drag.el) return;
      const scale = clamp(0.6 + (d - 120) / 300, 0.6, 2.2);
      drag.el.style.setProperty("--note-scale", scale);
      drag.scale = scale;
      const cx = (t1.x + t2.x) / 2, cy = (t1.y + t2.y) / 2;
      const p = toBoard(cx, cy);
      if (p) {
        drag.el.style.left = clamp(p[0] / BW, 0.04, 0.96) * 100 + "%";
        drag.el.style.top = clamp(p[1] / BH, 0.05, 0.95) * 100 + "%";
      }
    }
    function endDrag(e) {
      if (!drag || e.pointerId !== drag.pid) return;
      const d = drag;
      drag = null;
      d.el.classList.remove("drag");
      activeTouches.delete(e.pointerId);
      if (e.type === "pointercancel") { if (pending) { pending = false; renderBoard(); } return; }
      if (!d.moved) openRead(d.id);
      else if (d.x != null) {
        const n = notes.find(x => x.id === d.id);
        if (n) { n.scale = d.scale; n.x = d.x; n.y = d.y; n.z = maxZ() + 1; }
        try { Store.move(d.id, d.x, d.y, maxZ() + 1); } catch (_) { toast("No s'ha pogut desar la posició."); }
      }
      if (pending) { pending = false; renderBoard(); }
    }
    boardEl.addEventListener("pointerup", endDrag);
    boardEl.addEventListener("pointercancel", endDrag);

    /* ============ DETECCIÓ MILLORADA ============ */
    const det = { cv: document.createElement("canvas"), sm: null, seen: 0, timer: 0, told: false, nq: null };
    const dctx = det.cv.getContext("2d", { willReadFrequently: true });
    $("#bStart").onclick = startAR;
    async function startAR() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
      } catch (e) {
        toast(t("errCam")); setMode("home"); return;
      }
      const v = $("#cam");
      v.srcObject = stream;
      try { await v.play(); } catch (e) { }
      try {
        const tr = stream.getVideoTracks()[0], cp = tr.getCapabilities ? tr.getCapabilities() : {};
        if (cp.focusMode && cp.focusMode.includes("continuous")) await tr.applyConstraints({ advanced: [{ focusMode: "continuous" }] });
      } catch (e) { }
      setMode("ar"); renderBoard();
      det.sm = null; det.seen = 0; clearInterval(det.timer);
      det.timer = setInterval(detect, 120);
    }
    function stopCam() { clearInterval(det.timer); if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } $("#cam").srcObject = null; }
    function blobs() {
      const v = $("#cam");
      if (!v.videoWidth) return null;
      let W = DET.baseW;
      const H = Math.round(W * v.videoHeight / v.videoWidth);
      det.cv.width = W; det.cv.height = H;
      dctx.drawImage(v, 0, 0, W, H);
      let data = dctx.getImageData(0, 0, W, H).data;
      let candidates = analyzeColors(data, W, H);
      if (candidates.length < DET.minCandidates && W < DET.maxW) {
        W = DET.maxW;
        const H2 = Math.round(W * v.videoHeight / v.videoWidth);
        det.cv.width = W; det.cv.height = H2;
        dctx.drawImage(v, 0, 0, W, H2);
        data = dctx.getImageData(0, 0, W, H2).data;
        candidates = analyzeColors(data, W, H2);
      }
      return candidates.sort((a, b) => b.n - a.n).slice(0, 12);
    }
    function analyzeColors(data, W, H) {
      const m = new Uint8Array(W * H), out = [], st = [];
      const dfs = [];
      for (let i = 0, p = 0; i < data.length; i += 4, p++) {
        const r = data[i], g = data[i + 1], bl = data[i + 2];
        if (bl >= r || bl >= g) continue;
        const mx = r > g ? r : g, df = mx - bl;
        if (mx < 90 || df < 20) continue;
        dfs.push({ p, r, g, bl, mx, df });
      }
      if (dfs.length === 0) return out;
      dfs.sort((a, b) => b.df - a.df);
      const thr = dfs[Math.floor(dfs.length * 0.6)].df * 0.55;
      for (const { p, r, g, bl, mx, df } of dfs) {
        if (df < thr) continue;
        const h = r >= g ? 60 * (g - bl) / df : 120 - 60 * (r - bl) / df;
        if ((h >= 35 && h <= 75) || (h >= 190 && h <= 260) || (h >= 0 && h <= 20) || (h >= 320 && h <= 360)) {
          m[p] = 1;
        }
      }
      for (let s = 0; s < m.length; s++) {
        if (m[s] !== 1) continue;
        let n = 0, sx = 0, sy = 0, x0 = W, x1 = 0, y0 = H, y1 = 0;
        st.push(s); m[s] = 2;
        while (st.length) {
          const p = st.pop(), x = p % W, y = (p / W) | 0;
          n++; sx += x; sy += y;
          if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
          const nb = [p - 1, p + 1, p - W, p + W];
          for (const q of nb) {
            const qx = q % W, qy = (q / W) | 0;
            if (qx < 0 || qx >= W || qy < 0 || qy >= H) continue;
            if (Math.abs(qx - x) > 1 || Math.abs(qy - y) > 1) continue;
            if (m[q] === 1) { m[q] = 2; st.push(q); }
          }
        }
        const bw = x1 - x0 + 1, bh = y1 - y0 + 1, asp = bw / bh;
        const density = n / (bw * bh);
        if (n >= 14 && asp > 0.4 && asp < 2.4 && density > 0.35) {
          out.push({ n, x: sx / n / W, y: sy / n / H, w: bw / W, h: bh / H });
        }
      }
      return out;
    }
    function toScreen(p, v) {
      const sw = innerWidth, sh = innerHeight, vw = v.videoWidth, vh = v.videoHeight, k = Math.max(sw / vw, sh / vh);
      return [p.x * vw * k + (sw - vw * k) / 2, p.y * vh * k + (sh - vh * k) / 2];
    }
    const ordered = q => {
      const s = q.map(p => p.x + p.y), d = q.map(p => p.x - p.y);
      return [q[s.indexOf(Math.min(...s))], q[d.indexOf(Math.max(...d))], q[s.indexOf(Math.max(...s))], q[d.indexOf(Math.min(...d))]];
    };
    function quadScore(o) {
      if (new Set(o).size < 4) return 0;
      let a = 0, sg = 0;
      for (let i = 0; i < 4; i++) {
        const p = o[i], r = o[(i + 1) % 4], tt = o[(i + 2) % 4];
        a += p.x * r.y - r.x * p.y;
        const c = (r.x - p.x) * (tt.y - r.y) - (r.y - p.y) * (tt.x - r.x);
        if (!c) return 0;
        sg += c > 0 ? 1 : -1;
      }
      if (Math.abs(sg) !== 4) return 0;
      const area = Math.abs(a) / 2;
      const ns = o.map(p => p.n);
      const sim = Math.min(...ns) / Math.max(...ns);
      return sim < 0.3 ? 0 : area * sim;
    }
    function bestQuad(c) {
      let best = null, bs = 0;
      for (let a = 0; a < c.length; a++)
        for (let b = a + 1; b < c.length; b++)
          for (let e = b + 1; e < c.length; e++)
            for (let f = e + 1; f < c.length; f++) {
              const o = ordered([c[a], c[b], c[e], c[f]]), sc = quadScore(o);
              if (sc > bs) { bs = sc; best = o; }
            }
      return bs > 0.001 ? best : null;
    }
    function guess3(c, prev) {
      const idx = c.map(p => { let bi = 0, bd = 9; prev.forEach((q, i) => { const dd = Math.hypot(p.x - q.x, p.y - q.y); if (dd < bd) { bd = dd; bi = i; } }); return bi; });
      if (new Set(idx).size < 3) return null;
      const m = [0, 1, 2, 3].find(i => !idx.includes(i));
      let dx = 0, dy = 0;
      c.forEach((p, j) => { dx += p.x - prev[idx[j]].x; dy += p.y - prev[idx[j]].y; });
      dx /= 3; dy /= 3;
      const o = []; idx.forEach((i, j) => o[i] = c[j]);
      o[m] = { x: prev[m].x + dx, y: prev[m].y + dy, n: prev[m].n };
      return o;
    }
    function smoothQuad(prev, curr, alpha) {
      return curr.map((p, i) => ({ x: prev[i].x + (p.x - prev[i].x) * alpha, y: prev[i].y + (p.y - prev[i].y) * alpha, n: p.n }));
    }
    function drawDbg(bl, o, v) {
      const cv = $("#dbg");
      if (cv.width !== innerWidth) cv.width = innerWidth;
      if (cv.height !== innerHeight) cv.height = innerHeight;
      const g = cv.getContext("2d");
      g.clearRect(0, 0, cv.width, cv.height);
      g.lineWidth = 3;
      bl.forEach((p, i) => {
        const [x, y] = toScreen(p, v);
        g.strokeStyle = o && o.includes(p) ? "#2ee66b" : "rgba(255,255,255,.85)";
        g.beginPath(); g.arc(x, y, 14, 0, 7); g.stroke();
        g.fillStyle = "#fff"; g.font = "14px sans-serif"; g.fillText(i + 1, x + 6, y - 6);
      });
      if (o) {
        const pts = o.map(p => toScreen(p, v));
        g.strokeStyle = "#ffd60a"; g.lineWidth = 2;
        g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
        pts.forEach(pt => g.lineTo(pt[0], pt[1]));
        g.closePath(); g.stroke();
      }
    }
    function detect() {
      const v = $("#cam"), bl = blobs();
      if (!bl) return;
      const hint = $("#hint"), b = $("#board"), now = performance.now();
      let o = bl.length >= 4 ? bestQuad(bl) : null;
      if (!o && bl.length >= 3 && det.nq && now - det.seen < DET.graceMs) o = guess3(bl.slice(0, 3), det.nq);
      if (o) {
        if (det.sm) o = smoothQuad(det.sm, o, DET.emaAlpha);
        det.nq = o;
        lastValidQuad = o;
        lastValidTime = now;
      } else if (lastValidQuad && now - lastValidTime < DET.graceMs) {
        o = lastValidQuad;
      }
      drawDbg(bl, o || [], v);
      if (o) {
        det.sm = o;
        const pts = o.map(p => toScreen(p, v));
        det.sm = det.sm && now - det.seen < 800 ? det.sm.map((q, i) => [q[0] + (pts[i][0] - q[0]) * 0.5, q[1] + (pts[i][1] - q[1]) * 0.5]) : pts;
        det.seen = now;
        const h = hCoef([[0, 0], [BW, 0], [BW, BH], [0, BH]], det.sm);
        if (h) {
          const [a, bb, c, d, e, f, g, k] = h;
          b.style.transform = `matrix3d(${a},${d},0,${g},${bb},${e},0,${k},0,0,1,0,${c},${f},0,1)`;
          quad = det.sm;
          b.classList.add("on");
          hint.style.display = "none";
          if (!det.told) { det.told = true; toast("Arrossega una notícia per enganxar-la on vulgui."); }
        }
      } else if (now - det.seen > 1200) {
        b.classList.remove("on");
        det.sm = null; quad = null; det.nq = null;
        hint.style.display = "block";
        hint.textContent = t("hintPlace").replace("%d", Math.min(bl.length, 3));
      }
    }
    function hCoef(src, dst) {
      const A = [], y = [];
      for (let i = 0; i < 4; i++) {
        const [x, yy] = src[i], [u, vv] = dst[i];
        A.push([x, yy, 1, 0, 0, 0, -u * x, -u * yy]); y.push(u);
        A.push([0, 0, 0, x, yy, 1, -vv * x, -vv * yy]); y.push(vv);
      }
      const n = 8;
      for (let i = 0; i < n; i++) {
        let m = i;
        for (let r = i + 1; r < n; r++) if (Math.abs(A[r][i]) > Math.abs(A[m][i])) m = r;
        [A[i], A[m]] = [A[m], A[i]]; [y[i], y[m]] = [y[m], y[i]];
        for (let r = i + 1; r < n; r++) {
          const f = A[r][i] / A[i][i];
          for (let c = i; c < n; c++) A[r][c] -= f * A[i][c];
          y[r] -= f * y[i];
        }
      }
      const x = Array(n).fill(0);
      for (let i = n - 1; i >= 0; i--) {
        let s = y[i];
        for (let c = i + 1; c < n; c++) s -= A[i][c] * x[c];
        x[i] = s / A[i][i];
      }
      return x.some(v => !isFinite(v)) ? null : x;
    }

    /* ============ LECTURA + DENÚNCIA + ADMIN ============ */
    function openRead(id) {
      const n = notes.find(x => x.id === id);
      if (!n) return;
      const c = CATS[n.cat] || CATS.avisos;
      const col = /^#[0-9a-f]{6}$/i.test(n.color) ? n.color : "#007AFF";
      const p = $("#readPanel");
      p.style.setProperty("--c", col);
      const isAdminBtn = adminMode ? `<button class="btn danger" id="rDelAll">${t("deleteAll")}</button>` : "";
      const hideBtn = !adminMode ? `<button class="btn danger" id="rHide">${t("deleteMine")}</button>` : "";
      p.innerHTML = `<div class="grab"></div><div class="chip"><i style="background:${esc(col)}"></i>${c.label}</div>
        <h2>${esc(n.title)}</h2><div class="meta">${fmt(n.date)} · ${esc(n.author || "Anònim")}</div>
        ${okImg(n.img) ? `<img class="poster" src="${n.img}" alt="">` : ""}
        ${n.desc ? `<p>${esc(n.desc)}</p>` : ""}
        <div class="row" style="margin-top:12px">
          <button class="btn main" id="rClose">${t("close")}</button>
          ${hideBtn}
          ${isAdminBtn}
        </div>`;
      $("#read").classList.add("on");
      $("#rClose").onclick = () => $("#read").classList.remove("on");
      if (!adminMode) {
        $("#rHide").onclick = async () => {
          if (!confirm(t("deleteConfirmMine"))) return;
          hidden.add(id);
          try { localStorage.setItem(LSR, JSON.stringify([...hidden])); } catch (e) { }
          notes = notes.filter(x => x.id !== id);
          renderBoard();
          $("#read").classList.remove("on");
          toast(t("deletedMine"));
        };
      } else {
        $("#rDelAll").onclick = async () => {
          if (!confirm(t("deleteConfirmAll"))) return;
          try { await Store.deleteForAll(id); } catch (e) { toast("No s'ha pogut esborrar."); }
          $("#read").classList.remove("on");
          toast(t("deletedAll"));
        };
      }
    }
    $("#read").onclick = e => { if (e.target.id === "read") e.target.classList.remove("on"); };

    /* ============ ADMIN MODE ============ */
    function toggleAdmin(pin) {
      if (pin === ADMIN_PIN) {
        adminMode = true;
        adminPinAttempts = 0;
        $("#adminBar").style.display = "flex";
        toast(t("adminOn"));
      } else {
        adminPinAttempts++;
        toast("PIN incorrecte (" + adminPinAttempts + "/3)");
        if (adminPinAttempts >= 3) { adminPinAttempts = 0; toast("Demasiados intentos."); }
      }
    }
    function disableAdmin() {
      adminMode = false;
      $("#adminBar").style.display = "none";
      toast(t("adminOff"));
    }
    let logoClicks = 0;
    $(".brand h1")?.addEventListener("click", () => {
      logoClicks++;
      if (logoClicks >= 3) {
        const pin = prompt(t("adminPin"));
        if (pin !== null) toggleAdmin(pin);
        logoClicks = 0;
      }
    });

    /* ============ PUBLICAR ============ */
    function renderCats() {
      $("#fC").innerHTML = Object.entries(CATS).map(([k, v]) => `<option value="${k}">${v.icon} ${v.label}</option>`).join("");
    }
    $("#sw").innerHTML = COLORS.map((c, i) => `<label style="background:${c}"><input type="radio" name="col" value="${c}" ${i ? "" : "checked"}></label>`).join("");
    let pendingImg = null;
    let previewImgUrl = null;
    $("#fab").onclick = () => {
      pendingImg = null; previewImgUrl = null;
      $("#fFile").value = ""; $("#fFileSt").textContent = "";
      $("#preview").style.display = "none";
      $("#form").reset();
      $("#add").classList.add("on");
    };
    $("#fCancel").onclick = () => { $("#add").classList.remove("on"); };
    $("#fFileBtn").onclick = () => $("#fFile").click();
    $("#fCapBtn").onclick = () => $("#fFile").click();
    $("#fFile").onchange = async e => {
      const f = e.target.files[0];
      pendingImg = null; previewImgUrl = null;
      $("#preview").style.display = "none";
      if (!f) { $("#fFileSt").textContent = ""; return; }
      $("#fFileSt").textContent = "Processant el cartell…";
      $("#fOk").disabled = true;
      try {
        pendingImg = await fileToImg(f);
        previewImgUrl = pendingImg;
        $("#preview").style.display = "block";
        if (pendingImg) {
          $("#preview").innerHTML = `<img src="${pendingImg}" alt=""><p>${esc(f.name)}</p>`;
          $("#fFileSt").textContent = t("fileOk") + ": " + f.name + (f.type === "application/pdf" ? " (primera pàgina)" : "");
        } else {
          $("#fFileSt").textContent = t("errFileBig");
        }
      } catch (err) {
        $("#fFileSt").textContent = t("errFile");
      }
      $("#fOk").disabled = false;
    };
    function toJpeg(src, w, h) {
      const k = Math.min(1, 900 / w), cw = Math.round(w * k), ch = Math.round(h * k), c = document.createElement("canvas");
      c.width = cw; c.height = ch;
      const x = c.getContext("2d");
      x.fillStyle = "#fff"; x.fillRect(0, 0, cw, ch);
      x.drawImage(src, 0, 0, cw, ch);
      for (let q = 0.8; q >= 0.3; q -= 0.1) {
        const u = c.toDataURL("image/jpeg", q);
        if (u.length < 700000) return u;
      }
      return null;
    }
    const loadScript = u => new Promise((ok, ko) => { const s = document.createElement("script"); s.src = u; s.onload = ok; s.onerror = ko; document.head.appendChild(s); });
    async function fileToImg(f) {
      if (f.type === "application/pdf") {
        if (!window.pdfjsLib) {
          await loadScript(PDFJS + "pdf.min.js");
          pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js";
        }
        const pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
        const pg = await pdf.getPage(1);
        const v0 = pg.getViewport({ scale: 1 });
        const vp = pg.getViewport({ scale: 900 / v0.width });
        const c = document.createElement("canvas");
        c.width = vp.width; c.height = vp.height;
        await pg.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
        return toJpeg(c, c.width, c.height);
      }
      const bm = await createImageBitmap(f);
      return toJpeg(bm, bm.width, bm.height);
    }
    $("#fT").oninput = updatePreview;
    $("#fD").oninput = updatePreview;
    function updatePreview() {
      const title = $("#fT").value.trim();
      const desc = $("#fD").value.trim();
      const prev = $("#preview");
      if (!title && !desc && !previewImgUrl) { prev.style.display = "none"; return; }
      prev.style.display = "block";
      if (previewImgUrl) prev.innerHTML = `<img src="${previewImgUrl}" alt="">`;
      prev.innerHTML += `<p>${esc(title || "")}<br>${esc(desc || "")}</p>`;
    }
    $("#form").onsubmit = async e => {
      e.preventDefault();
      const d = $("#fD").value.trim();
      if (!d && !pendingImg) { toast("Escriu una descripció o importa un cartell."); return; }
      const n = {
        cat: $("#fC").value,
        title: $("#fT").value.trim(),
        desc: d,
        author: $("#fA").value.trim() || "Anònim",
        color: document.querySelector("input[name=col]:checked").value,
        date: new Date().toISOString().slice(0, 10),
        x: 0.5 + (Math.random() - 0.5) * 0.2,
        y: 0.5 + (Math.random() - 0.5) * 0.2,
        z: maxZ() + 1,
        reports: 0,
        tpl: document.querySelector("input[name=tpl]:checked")?.value || "m"
      };
      if (pendingImg) n.img = pendingImg;
      $("#fOk").disabled = true;
      try {
        await Store.add(n);
        $("#form").reset();
        pendingImg = null;
        $("#fFileSt").textContent = "";
        $("#preview").style.display = "none";
        $("#add").classList.remove("on");
        toast(t("saved"));
      } catch (err) {
        toast(t("errSave"));
      }
      $("#fOk").disabled = false;
    };

    /* ============ PWA ============ */
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js").catch(() => { });
    }

    /* ============ INICI ============ */
    Store.init().then(() => {
      const sy = $("#sync");
      if (Store.live) { sy.dataset.s = "ok"; sy.textContent = "Tauler compartit: tothom ve el mateix"; }
      else if (REQUIRE_SHARED) {
        $("#bStart").disabled = true;
        sy.dataset.s = "warn";
        sy.textContent = "Falta connectar la base de dades compartida (Firebase). L'AR està desactivada.";
      } else {
        sy.dataset.s = "local";
        sy.textContent = t("sync");
      }
      renderFilters();
      setLang(LANG);
      if (Store.live && new URLSearchParams(location.search).get("ar") === "1") startAR();
    });
  </script>
</body>
